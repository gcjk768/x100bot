telegram:
  chat_id: "@your_channel_or_numeric_id"    # the learning channel, one item per message. TELEGRAM_CHAT_ID in .env overrides
  message_thread_id: null                    # forum topic id when posting into a group topic. TELEGRAM_THREAD_ID overrides
  owner_user_id: 0                           # my Telegram user id. The bot answers nobody else
  admin_chat_id: ""                          # usually my private chat with the bot, for alerts. Empty means log only
  notify_types: [brief, golden_hour]         # these post with sound, all other types post silently
  preview_above_text: true                   # show the link preview image above the text
  replace_previous_day: false                # true deletes yesterday's posts at 06:55. Bots can only delete posts younger than 48 hours
schedule:
  timezone: Asia/Singapore
  sources_cron: "0 5 * * *"
  plan_cron: "30 5 * * *"
  firmware_cron: "15 5 * * 1"
  post_minute: 0
  misfire_grace_minutes: 30
  slots: {"07": brief, "08": recipe, "09": camera_tip, "10": composition, "11": recipe, "12": photographer, "13": camera_tip, "14": video_lesson, "15": recipe, "16": drill, "17": golden_hour, "18": recipe, "19": composition, "20": recipe, "21": learning_tip, "22": review}
  sunday_overrides: {"21": weekly_recap}
location:
  name: Singapore
  latitude: 1.3521
  longitude: 103.8198
camera:
  model: X100VI
  facts_file: camera/x100vi_facts.yaml
  menus_file: camera/menus.yaml
learning:
  start_date: "2026-10-05"                   # a Monday. Week 1 of the curriculum starts here
  level: intermediate
  curriculum_file: library/curriculum.yaml
  spots_file: library/spots.yaml
  learning_topics: [culling, reading light, storytelling and series, straight out of camera workflow, street etiquette, gear care in humidity, backing up to the NAS, choosing a recipe for the light]
library:
  recipe_repeat_days: 45
  photographer_repeat_days: 45
  camera_tip_repeat_days: 30
  lesson_repeat_days: 60
  video_repeat: never
  min_stock: {recipe: 40, photographer: 10, camera_tip: 20, video: 10}
sources:
  recipe_indexes:                            # confirm both URLs during the build
    - {name: "Fuji X Weekly, X-Trans V", url: "https://fujixweekly.com/fujifilm-x-trans-v-recipes/", sensor: "X-Trans V", parser: fujixweekly}
    - {name: "Fuji X Weekly, X-Trans IV", url: "https://fujixweekly.com/fujifilm-x-trans-iv-recipes/", sensor: "X-Trans IV", parser: fujixweekly}
  feeds:
    - {name: "Fuji X Weekly", url: "https://fujixweekly.com/feed/", kind: rss}     # confirm during the build
  youtube_channels:                          # starting points. Resolve each channel_id during the build, drop any that is inactive or off topic, add others that teach composition
    - "FUJIFILM X Series (official)"
    - "Sean Tucker"
    - "Pierre T. Lambert"
    - "Kevin Mullins"
    - "Valerie Jardin"
    - "James Popsys"
    - "Jamie Windsor"
    - "Mark Denney"
  manual_base: "https://fujifilm-dsc.com/en/manual/x100vi/"
  firmware_page: ""                          # the official X100VI firmware download page, found during the build
weather:
  rain_probability: 60                       # at or above this percent the hour counts as rain
  overcast_cloud_cover: 70
  sunny_cloud_cover: 30
claude:
  binary: claude
  model: sonnet
  fallback_model: haiku
  auth: oauth                                # oauth = CLAUDE_CODE_OAUTH_TOKEN, apikey = ANTHROPIC_API_KEY plus --bare
  max_retries: 4                             # passed as CLAUDE_CODE_MAX_RETRIES
  research: {max_turns: 40, timeout_seconds: 900}
  compose:  {max_turns: 4, timeout_seconds: 600}
  critique: {max_turns: 4, timeout_seconds: 300, max_long_edge_px: 2048}
  no_tools: [Bash, Edit, Write, Read, Glob, Grep, WebFetch, WebSearch, Agent, NotebookEdit]
limits:
  web:
    per_domain_min_gap_seconds: 6            # random wait between 6 and 12 seconds per domain
    per_domain_max_gap_seconds: 12
    max_requests_per_day: 150                # all websites together, link checks included
    max_new_recipe_pages_per_day: 10
    max_seed_pages: 150                      # only for the one time `x100bot seed`
    retries: 2
    backoff_seconds: [30, 120]
    domain_cooldown_hours: 24                # after HTTP 429 or 403, or three failures in a row
    link_check_cache_days: 14
    respect_robots_txt: true
    user_agent: "x100bot/1.0 (personal learning bot, low volume)"
  openmeteo:
    max_calls_per_day: 6
  telegram:
    min_gap_seconds: 1.2
    max_per_minute: 20
    max_retries: 5
    max_retry_after_seconds: 900
    poll_timeout_seconds: 50
  claude:
    max_scheduled_calls_per_day: 3           # research, compose, one retry
    max_critiques_per_day: 10
repair:
  enabled: false
