# Verified X100VI facts. Every entry carries the official URL it came from.
# spec_page: Fujifilm's specification page. It answers HTTP 403 to the bot's user agent, so the bot cannot reopen it;
#            the entries marked spec_page come from the build brief, which quotes that page. Where the official
#            manual states the same fact, manual_spec is given as well and was checked on 2026-10-01.
# Add more facts only from manual pages, each with its URL.
sources:
  spec_page: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
  manual_spec: https://fujifilm-dsc.com/en/manual/x100vi/technical_notes/spec/
  image_quality_setting: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/

facts:
  - id: sensor
    text: APS-C X-Trans CMOS 5 HR sensor, about 40.2 million pixels
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
    manual_spec: https://fujifilm-dsc.com/en/manual/x100vi/technical_notes/spec/
  - id: processor
    text: X-Processor 5
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
  - id: lens
    text: fixed 23mm lens, 35mm in 35mm format terms, maximum aperture F2.0
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
    manual_spec: https://fujifilm-dsc.com/en/manual/x100vi/technical_notes/spec/
  - id: min_focus
    text: minimum focus distance about 10 cm
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
  - id: nd_filter
    text: built in ND filter of 4 stops, switched with ND FILTER in SHOOTING SETTING
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
    menu_url: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/shooting_setting/#nd_filter
  - id: digital_teleconverter
    text: DIGITAL TELE-CONV. gives 35mm (normal), 50mm and 70mm equivalent framings
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
    menu_url: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/shooting_setting/#digital_telecon
  - id: ibis
    text: in body image stabilisation, 5 axis sensor shift, up to 6.0 stops, set with IS MODE
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
  - id: iso
    text: standard ISO 125 to 12800, extended ISO 64, 80, 100, 25600 and 51200
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
    manual_spec: https://fujifilm-dsc.com/en/manual/x100vi/technical_notes/spec/
  - id: shutter
    text: mechanical shutter up to 1/4000 s, electronic shutter up to 1/180000 s
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
    manual_spec: https://fujifilm-dsc.com/en/manual/x100vi/technical_notes/spec/
  - id: viewfinder
    text: hybrid viewfinder, optical (OVF) and 0.5 inch OLED electronic (EVF)
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
    manual_spec: https://fujifilm-dsc.com/en/manual/x100vi/technical_notes/spec/
  - id: battery
    text: NP-W126S battery, about 310 frames with the EVF and about 450 with the OVF (NORMAL performance mode)
    url: https://www.fujifilm-x.com/global/products/cameras/x100vi/specifications/
    manual_spec: https://fujifilm-dsc.com/en/manual/x100vi/technical_notes/spec/
  - id: exposure_compensation
    text: exposure compensation from -5 EV to +5 EV in 1/3 EV steps for stills
    url: https://fujifilm-dsc.com/en/manual/x100vi/technical_notes/spec/
  - id: dr_iso
    text: DYNAMIC RANGE 200% needs ISO 250 or higher, 400% needs ISO 500 or higher
    url: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#dynamic_range
  - id: drp
    text: any D RANGE PRIORITY other than OFF sets TONE CURVE and DYNAMIC RANGE automatically
    url: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#d_range_priority
  - id: heif_clarity
    text: choosing HEIF in SELECT JPEG/HEIF disables CLARITY and sets COLOR SPACE to sRGB
    url: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#jpeg_heif
  - id: custom_banks
    text: seven custom settings banks, CUSTOM 1 to CUSTOM 7, saved with EDIT/SAVE CUSTOM SETTING and recalled with SELECT CUSTOM SETTING; AUTO UPDATE CUSTOM SETTING is ENABLE or DISABLE
    url: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#select_custom_setting

# 20 film simulation modes, names exactly as the manual writes them
film_simulations:
  url: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#film_simulation
  color: [PROVIA/STANDARD, Velvia/VIVID, ASTIA/SOFT, CLASSIC CHROME, REALA ACE, PRO Neg. Hi, PRO Neg. Std,
          CLASSIC Neg., NOSTALGIC Neg., ETERNA/CINEMA, ETERNA BLEACH BYPASS]
  monochrome: [ACROS, ACROS+Ye FILTER, ACROS+R FILTER, ACROS+G FILTER, MONOCHROME, MONOCHROME+Ye FILTER,
               MONOCHROME+R FILTER, MONOCHROME+G FILTER, SEPIA]

# allowed values per setting; the recipe validator uses these
settings:
  grain_roughness: {values: ["OFF", WEAK, STRONG], url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#grain_effect"}
  grain_size: {values: [SMALL, LARGE], url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#grain_effect"}
  color_chrome_effect: {values: ["OFF", WEAK, STRONG], url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#color_chrome_effect"}
  color_chrome_fx_blue: {values: ["OFF", WEAK, STRONG], url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#color_chrome_blue"}
  smooth_skin_effect: {values: ["OFF", WEAK, STRONG], url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#smooth_skin_effect"}
  white_balance:
    values: [WHITE PRIORITY, AUTO, AMBIENCE PRIORITY, CUSTOM 1, CUSTOM 2, CUSTOM 3, COLOR TEMPERATURE, DAYLIGHT,
             SHADE, FLUORESCENT LIGHT-1, FLUORESCENT LIGHT-2, FLUORESCENT LIGHT-3, INCANDESCENT, UNDERWATER]
    kelvin: {min: 2500, max: 10000}
    url: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#white_balance
  wb_shift:
    red: {min: -9, max: 9}
    blue: {min: -9, max: 9}
    url: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#white_balance
    note: the manual shows the range only in its WB SHIFT screenshot (images/osd_mn_sm_wb_shift_x100-6_en.png), a grid of 19 positions per axis, so -9 to +9
  dynamic_range: {values: [AUTO, "100%", "200%", "400%"], url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#dynamic_range"}
  d_range_priority: {values: [AUTO, STRONG, WEAK, "OFF"], url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#d_range_priority"}
  highlight: {min: -2, max: 4, step: 0.5, url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#tone_curve"}
  shadow: {min: -2, max: 4, step: 0.5, url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#tone_curve"}
  color: {min: -4, max: 4, step: 1, url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#color"}
  sharpness: {min: -4, max: 4, step: 1, url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#sharpness"}
  high_iso_nr: {min: -4, max: 4, step: 1, url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#high_iso_nr"}
  clarity: {min: -5, max: 5, step: 1, url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#clarity"}
  monochromatic_color:
    warm_cool: {min: -18, max: 18}
    magenta_green: {min: -18, max: 18}
    url: https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#monochromatic
    note: the manual shows the range only in its MONOCHROMATIC COLOR screenshot (images/osd_mn_sm_mono_color_x100-6_en.png), a grid of 37 positions per axis, so -18 to +18
  iso: {standard: {min: 125, max: 12800}, extended: [64, 80, 100, 25600, 51200], url: "https://fujifilm-dsc.com/en/manual/x100vi/technical_notes/spec/"}
  exposure_compensation: {min: -5, max: 5, url: "https://fujifilm-dsc.com/en/manual/x100vi/technical_notes/spec/"}
  custom_banks: {min: 1, max: 7, url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#select_custom_setting"}
  auto_update_custom_setting: {values: [ENABLE, DISABLE], url: "https://fujifilm-dsc.com/en/manual/x100vi/menu_shooting/image_quality_setting/#auto_update_custom_setting"}
