[project]
name = "x100bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml", "httpx", "apscheduler>=3.10,<4", "astral>=3", "feedparser>=6",
                "beautifulsoup4", "lxml", "pillow", "tzdata"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
x100bot = "x100bot.cli:main"

[tool.setuptools]
packages = ["x100bot", "x100bot.library", "x100bot.library.parsers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
